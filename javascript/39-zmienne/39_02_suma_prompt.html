alert("wartosc k wynosi " + k);

// Wczytywanie liczb: prompt + Number (inaczej "4"+"5" = "45" a nie 9)

<script>
// Poprawne sumowanie wpisanych liczb:
var xx = Number(prompt("Podaj x:"));

document.write("<br>Suma liczb " + xx + " oraz " + yy + " wynosi " + s);
