<script>
// PRZYKLAD 40.2 - operatory porownania: == === != > >= < <=
// == porownuje wartosc, === wartosc i typ
var x = 7;
var y = 2;
document.write("Wynikiem porownania x &lt; y jest " + (x < y) + "<br>");
var a = 6;
var b = "6"; // b jest tekstem
document.write("Wynikiem porownania a == b jest " + (a == b) + "<br>");   // true
document.write("Wynikiem porownania a === b jest " + (a === b) + "<br>"); // false
// Wynikiem porownania x<y jest false
// Wynikiem porownania a==b jest true
// Wynikiem porownania a===b jest false
</script>
