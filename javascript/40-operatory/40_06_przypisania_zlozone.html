<script>
// PRZYKLAD 40.6 - zlozone operatory przypisania z operacja bitowa i arytmetyczna
var a = 8;
var b = 15;
var c = 10;
document.write("<b>Przed dzialaniem operatorow przypisania:</b><br>a=" + a + " b=" + b + " c=" + c + "<br>");
a += b; // a = a+b
c *= b; // c = c*b
document.write("<b>Po dzialaniu operatorow przypisania:</b><br>a=" + a + " b=" + b + " c=" + c + "<br>");
// Przed: a=8 b=15 c=10 / Po: a=23 b=15 c=150
</script>
