<script>
// PRZYKLAD 40.1 - operatory arytmetyczne: + - * / %
var x = 7;
var y = 2;
document.write(x + " + " + y + " = " + (x + y) + "<br>");
document.write(x + " - " + y + " = " + (x - y) + "<br>");
document.write(x + " * " + y + " = " + (x * y) + "<br>");
document.write(x + " / " + y + " = " + (x / y) + "<br>");
document.write(x + " % " + y + " = " + (x % y) + "<br>");
// Wynik: 7+2=9, 7-2=5, 7*2=14, 7/2=3.5, 7%2=1
</script>
