<script>
// PRZYKLAD 40.7 - inkrementacja ++ i dekrementacja --
// a++ najpierw wyswietla, potem zwieksza; ++b najpierw zwieksza, potem wyswietla
var a = 8;
var b = 15;
document.write((a++) + "<br>"); // wyswietli 8, a bedzie 9
document.write((++b) + "<br>"); // najpierw b=16, wyswietli 16
</script>
