<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Tabele dwuwymiarowe w JS</title>
<style>
table, tr, td { border: 1px solid magenta; }
table { width: 200px; height: 100px; text-align: center; }
</style>
</head>
<body>
<script>
// PRZYKLAD 43.9 - tablica dwuwymiarowa 3 wiersze x 2 kolumny, losowanie 1..50
var tab = new Array(2);
// deklaracja tablicy o 3 wierszach i 2 kolumnach
for (var i = 0; i < 3; i++) { tab[i] = []; }
// wylosowanie wartosci dla tablicy
for (var i = 0; i < 3; i++) {
  for (var j = 0; j < 2; j++) {
    tab[i][j] = Math.round(50 * Math.random() + 1);
  }
}
// wyswietlenie wartosci w tabeli
document.write("<table>");
for (var i = 0; i < 2; i++) {
  document.write("<tr>");
  for (var j = 0; j < 3; j++) {
    document.write("<td>" + tab[j][i] + "</td>");
  }
  document.write("</tr>");
}
document.write("</table>");
</script>
</body>
</html>
