<script>
// PRZYKLAD 43.2 - obiekt STRING: big, blink, bold, italics, fontcolor, fontsize, toUpperCase, substring...
var tekst = "Uczymy sie programowac w JavaScript";
document.write(tekst + "<br>");
document.write(tekst.italics() + "<br>");
document.write(tekst.fontcolor("red") + "<br>");
document.write(tekst.fontsize("14px") + "<br>");
document.write(tekst.small() + "<br>");
document.write(tekst.big() + "<br>");
document.write(tekst.bold() + "<br>");
document.write(tekst.toUpperCase() + "<br>");
document.write(tekst.substring(25, 35) + "<br>");
document.write(tekst.italics().fontcolor("blue") + "<br>");
</script>
