<script>
// PRZYKLAD 41.4 - if...else if...else, liczba dodatnia/ujemna/zero
var liczba = Number(prompt("Podaj liczbe: "));
if (liczba > 0)
{
  alert("Liczba " + liczba + " jest dodatnia");
}
else if (liczba < 0)
{
  alert("Liczba " + liczba + " jest ujemna");
}
else
{
  alert("Liczba jest rowna 0");
}
</script>
