<script>
// PRZYKLAD 41.5 - najwieksza z 3 liczb, && (i)
var a = Number(prompt("Podaj a: "));
var b = Number(prompt("Podaj b: "));
var c = Number(prompt("Podaj c: "));
document.write("<u>Podales liczby:</u> " + a + ", " + b + ", " + c + "<br>");
if (a >= b && a >= c)
{
  document.write("Najwieksza z nich jest " + a);
}
else if (b >= a && b >= c)
{
  document.write("Najwieksza z nich jest " + b);
}
else
{
  document.write("Najwieksza z nich jest " + c);
}
</script>
