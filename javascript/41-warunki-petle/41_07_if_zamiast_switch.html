<script>
// PRZYKLAD 41.7 - to samo co SWITCH ale na IFach (kazdy SWITCH da sie zamienic na IF)
var a = prompt("Podaj liczbe od 1 do 7:");
if (a == "1")
{
  document.write("Dzis jest poniedzialek.");
}
else if (a == "2")
{
  document.write("Dzis jest wtorek.");
}
else if (a == "3")
{
  document.write("Dzis jest sroda.");
}
else if (a == "4")
{
  document.write("Dzis jest czwartek.");
}
else if (a == "5")
{
  document.write("Dzis jest piatek.");
}
else if (a == "6")
{
  document.write("Dzis jest sobota.");
}
else if (a == "7")
{
  document.write("Dzis jest niedziela.");
}
else
{
  document.write("Wybrales zla liczbe.");
}
</script>
