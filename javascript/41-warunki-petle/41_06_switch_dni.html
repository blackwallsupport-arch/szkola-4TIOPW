<script>
// PRZYKLAD 41.6 - instrukcja SWITCH, dni tygodnia 1-7
var a = prompt("Podaj liczbe od 1 do 7:");
switch (a)
{
  case "1": document.write("Dzis jest poniedzialek."); break;
  case "2": document.write("Dzis jest wtorek."); break;
  case "3": document.write("Dzis jest sroda."); break;
  case "4": document.write("Dzis jest czwartek."); break;
  case "5": document.write("Dzis jest piatek."); break;
  case "6": document.write("Dzis jest sobota."); break;
  case "7": document.write("Dzis jest niedziela."); break;
  default: document.write("Wybrales zla liczbe."); break;
}
</script>
